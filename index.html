<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>NO TRACE — Iron Tide</title>
  <meta name="description" content="NO TRACE: Tactical pixel-art covert stealth-action side-scroller. Infiltrate Kestrel Dynamics as Operative Vikram Ghost Rao." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05070b;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Share Tech Mono', monospace;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    canvas {
      display: block;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 20px rgba(10, 40, 70, 0.3);
    }
    /* Portrait warning overlay */
    #portrait-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 7, 11, 0.97);
      color: #38bdf8;
      z-index: 99999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    #portrait-overlay .phone-icon {
      font-size: 54px;
      margin-bottom: 20px;
      animation: rotate-hint 2s infinite ease-in-out;
    }
    #portrait-overlay h2 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 24px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #f59e0b;
      margin-bottom: 8px;
    }
    #portrait-overlay p {
      font-size: 14px;
      color: #94a3b8;
      max-width: 280px;
      line-height: 1.4;
    }
    @keyframes rotate-hint {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
    }
    @media (orientation: portrait) {
      #portrait-overlay {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="portrait-overlay">
    <div class="phone-icon">📱 ↷</div>
    <h2>Tactical Feed: Rotate Device</h2>
    <p>Please orient your device horizontally for tactical side-view operation.</p>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
