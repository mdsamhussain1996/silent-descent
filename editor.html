<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NO TRACE — 2.5D Mission Kit & Room Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #080d16;
      color: #f8fafc;
      font-family: 'Share Tech Mono', monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #04070e;
      border-bottom: 1px solid #1e293b;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 20px;
      color: #38bdf8;
      letter-spacing: 2px;
    }
    .tools {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    button, select {
      background: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 6px 14px;
      font-family: inherit;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    button.active {
      background: #0284c7;
      border-color: #38bdf8;
    }
    #workspace {
      flex: 1;
      display: flex;
      position: relative;
    }
    #editor-canvas {
      flex: 1;
      background: #0a0f1d;
      cursor: crosshair;
    }
    #sidebar {
      width: 280px;
      background: #04070f;
      border-left: 1px solid #1e293b;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    textarea {
      flex: 1;
      background: #090e17;
      border: 1px solid #1e293b;
      color: #10b981;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      padding: 8px;
      resize: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>NO TRACE // 2.5D MISSION ROOM EDITOR</h1>
    <div class="tools">
      <label>TOOL:</label>
      <button class="tool-btn active" data-tool="solid">Solid Block</button>
      <button class="tool-btn" data-tool="catwalk">Catwalk (1-Way)</button>
      <button class="tool-btn" data-tool="pipe">Hanging Pipe</button>
      <button class="tool-btn" data-tool="crate">Crate</button>
      <button class="tool-btn" data-tool="guard">Guard</button>
      <button class="tool-btn" data-tool="camera">Camera</button>
      <button class="tool-btn" data-tool="laser">Laser</button>
      <button class="tool-btn" data-tool="terminal">Terminal</button>
      <button id="btn-export">Export JSON</button>
      <button id="btn-play" onclick="location.href='./index.html'">Play Game ▷</button>
    </div>
  </header>
  <div id="workspace">
    <canvas id="editor-canvas"></canvas>
    <div id="sidebar">
      <h3>MISSION JSON DATA</h3>
      <textarea id="json-output" readonly></textarea>
      <button id="btn-copy">Copy to Clipboard</button>
    </div>
  </div>

  <script type="module">
    const canvas = document.getElementById('editor-canvas');
    const ctx = canvas.getContext('2d');
    const jsonOutput = document.getElementById('json-output');

    let currentTool = 'solid';
    const missionData = {
      id: "custom_mission",
      name: "Custom 2.5D Room",
      kitPieces: [],
      entities: []
    };

    function resize() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
      draw();
    }
    window.addEventListener('resize', resize);

    document.querySelectorAll('.tool-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTool = btn.dataset.tool;
      });
    });

    const scale = 30; // 30px = 1 meter
    let originX = 100;
    let originY = 400;

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Grid
      ctx.strokeStyle = '#111a28';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += scale) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += scale) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Ground Axis
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, originY); ctx.lineTo(canvas.width, originY); ctx.stroke();

      // Draw Pieces
      missionData.kitPieces.forEach(p => {
        if (p.type === 'solid' || p.type === 'crate') {
          ctx.fillStyle = p.type === 'crate' ? '#784315' : '#1e293b';
          ctx.fillRect(originX + p.x * scale, originY - (p.y + p.h) * scale, p.w * scale, p.h * scale);
        } else if (p.type === 'catwalk') {
          ctx.fillStyle = '#38bdf8';
          ctx.fillRect(originX + p.x * scale, originY - p.y * scale, p.w * scale, 6);
        } else if (p.type === 'pipe') {
          ctx.strokeStyle = '#94a3b8';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(originX + p.x1 * scale, originY - p.y * scale);
          ctx.lineTo(originX + p.x2 * scale, originY - p.y * scale);
          ctx.stroke();
        }
      });

      // Draw Entities
      missionData.entities.forEach(e => {
        if (e.type === 'guard') {
          ctx.fillStyle = '#f59e0b';
          ctx.fillRect(originX + (e.x - 0.25) * scale, originY - (e.y + 1.7) * scale, 0.5 * scale, 1.7 * scale);
        } else if (e.type === 'camera') {
          ctx.fillStyle = '#00f0ff';
          ctx.beginPath();
          ctx.arc(originX + e.x * scale, originY - e.y * scale, 8, 0, Math.PI * 2);
          ctx.fill();
        } else if (e.type === 'laser') {
          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(originX + e.x * scale, originY - e.y1 * scale);
          ctx.lineTo(originX + e.x * scale, originY - e.y2 * scale);
          ctx.stroke();
        } else if (e.type === 'terminal') {
          ctx.fillStyle = '#10b981';
          ctx.fillRect(originX + (e.x - 0.3) * scale, originY - (e.y + 0.9) * scale, 0.6 * scale, 0.9 * scale);
        }
      });

      jsonOutput.value = JSON.stringify(missionData, null, 2);
    }

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      // Snap to 1 meter grid
      const gridX = Math.round((mouseX - originX) / scale);
      const gridY = Math.round((originY - mouseY) / scale);

      if (currentTool === 'solid') {
        missionData.kitPieces.push({ type: 'solid', x: gridX, y: gridY, w: 2, h: 1 });
      } else if (currentTool === 'catwalk') {
        missionData.kitPieces.push({ type: 'catwalk', x: gridX, y: gridY, w: 4, h: 0.15 });
      } else if (currentTool === 'pipe') {
        missionData.kitPieces.push({ type: 'pipe', x1: gridX, x2: gridX + 4, y: gridY });
      } else if (currentTool === 'crate') {
        missionData.kitPieces.push({ type: 'crate', x: gridX, y: gridY, w: 1, h: 1 });
      } else if (currentTool === 'guard') {
        missionData.entities.push({ type: 'guard', x: gridX, y: gridY, patrolMinX: gridX - 3, patrolMaxX: gridX + 3 });
      } else if (currentTool === 'camera') {
        missionData.entities.push({ type: 'camera', x: gridX, y: gridY });
      } else if (currentTool === 'laser') {
        missionData.entities.push({ type: 'laser', x: gridX, y1: gridY, y2: gridY + 3 });
      } else if (currentTool === 'terminal') {
        missionData.entities.push({ type: 'terminal', x: gridX, y: gridY });
      }

      draw();
    });

    document.getElementById('btn-copy').addEventListener('click', () => {
      navigator.clipboard.writeText(jsonOutput.value);
      alert('Mission JSON copied to clipboard!');
    });

    setTimeout(resize, 100);
  </script>
</body>
</html>
